[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "audiobooktts"
dynamic = ["version"]
description = "Convert EPUB e-books into chaptered, loudness-mastered M4B audiobooks with open-source, voice-cloning TTS that runs locally."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Struthers" }]
keywords = ["audiobook", "epub", "m4b", "tts", "text-to-speech", "chatterbox", "voice-cloning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "lxml>=4.9",
    "num2words>=0.5.12",
    "numpy>=1.24",
    "python-multipart>=0.0.9",
    "rich>=13.0",
    "soundfile>=0.12",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
# Apple Silicon: Chatterbox on the GPU through MLX. Fastest option on a Mac.
mlx = ["mlx-audio>=0.4"]
# Windows, Linux and Intel Macs: the official PyTorch Chatterbox (CUDA, CPU or MPS).
torch = ["chatterbox-tts>=0.1.6"]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
abtts = "audiobooktts.cli:main"

[project.urls]
Homepage = "https://github.com/s4mstruthers/AudiobookTTS"
Issues = "https://github.com/s4mstruthers/AudiobookTTS/issues"

[tool.hatch.version]
path = "src/audiobooktts/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobooktts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # epub.py silences this globally at import; pytest resets filters per test.
    "ignore::bs4.XMLParsedAsHTMLWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # typographic quotes and dashes are intentional in text-normalisation code
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["audiobooktts"]
